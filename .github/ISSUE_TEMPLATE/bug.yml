name: 🐛 Bug Report
description: 报告 Agent / 工具调用 / 前端显示的 bug
title: "[Bug] "
labels: ["bug", "agent-travel-planner"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你提 bug！请尽可能详细描述复现步骤和环境。
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入 ...
        2. 输入 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      placeholder: 应该返回 ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 实际返回 ...
  - type: input
    id: model
    attributes:
      label: 使用的 LLM
      placeholder: DeepSeek / OpenAI / 智谱 ...
  - type: dropdown
    id: amap
    attributes:
      label: 高德 API Key 是否配置
      options:
        - 已配置
        - 未配置
        - 不确定
